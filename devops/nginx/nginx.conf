events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Upstream definitions
    upstream keycloak {
        server keycloak:8080;
    }

    # Placeholder for future gateway and core-service
    # upstream gateway {
    #     server gateway-service:8080;
    # }
    # upstream core-service {
    #     server core-service:8080;
    # }

    server {
        listen 80;
        server_name localhost;

        # Keycloak - auth endpoints (Keycloak serves at /auth with KC_HTTP_RELATIVE_PATH)
        location /auth/ {
            proxy_pass http://keycloak/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
            proxy_temp_file_write_size 256k;
        }

        # Health check
        location /health {
            access_log off;
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # Future: API gateway, core-service, frontend
        # location /api/ { proxy_pass http://gateway/; }
        # location /core/ { proxy_pass http://core-service/; }
        # location / { proxy_pass http://frontend:3000; }
    }
}
