services:
  mysql:
    image: mysql:8.4
    container_name: secureflow-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-secureflow_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-secureflow}
      MYSQL_USER: ${MYSQL_USER:-secureflow}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-secureflow}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./devops/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:8-alpine
    container_name: secureflow-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:4.0.1
    container_name: secureflow-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      - "9092:9092"
      - "9093:9093"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 20s
      timeout: 30s
      retries: 10
      start_period: 120s

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.0
    container_name: secureflow-keycloak
    command: ["start", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://mysql:3306/keycloak
      KC_DB_USERNAME: ${MYSQL_USER:-secureflow}
      KC_DB_PASSWORD: ${MYSQL_PASSWORD:-secureflow}
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./devops/keycloak/realm-export.json:/opt/keycloak/data/import/secureflow-realm.json
    depends_on:
      mysql:
        condition: service_healthy

  kafka-init:
    image: apache/kafka:4.0.1
    container_name: secureflow-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        kafka-topics --create --if-not-exists \
          --bootstrap-server kafka:9092 \
          --topic audit-events \
          --partitions 3 \
          --replication-factor 1
    profiles:
      - init

  flyway:
    image: flyway/flyway:10
    container_name: secureflow-flyway
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./devops/flyway/sql:/flyway/sql
    environment:
      FLYWAY_URL: jdbc:mysql://mysql:3306/secureflow
      FLYWAY_USER: ${MYSQL_USER:-secureflow}
      FLYWAY_PASSWORD: ${MYSQL_PASSWORD:-secureflow}
      FLYWAY_BASELINE_ON_MIGRATE: "true"
    command: migrate
    profiles:
      - init

  nginx:
    image: nginx:alpine
    container_name: secureflow-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./devops/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - keycloak

volumes:
  mysql_data:
