# Core Service — Configurazione principale
spring:
  application:
    name: core-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/secureflow?allowPublicKeyRetrieval=true&useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:secureflow}
    password: ${SPRING_DATASOURCE_PASSWORD:secureflow}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:19092}
  security:
    oauth2:
      resourceserver:
        jwt:
          # JWKS only — issuer claim validated via JwtConfig (expected-issuer)
          jwk-set-uri: ${JWK_SET_URI:http://localhost:8180/auth/realms/secureflow/protocol/openid-connect/certs}

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    io.secureflow: ${SECUREFLOW_LOG_LEVEL:DEBUG}
    org.springframework.security: WARN

secureflow:
  webhook:
    worker-enabled: true
    poll-interval-ms: 2000
  internal-token: ${SECUREFLOW_INTERNAL_TOKEN:secureflow-internal}
  audit:
    topic: audit-events
    consumer-enabled: true
  jwt:
    # When ISSUER_URI is blank, validate this claim against the token iss
    expected-issuer: ${JWT_EXPECTED_ISSUER:http://localhost:8180/auth/realms/secureflow}
