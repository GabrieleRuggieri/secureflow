# Profile "test" — H2 in-memory, no Flyway
#
# ddl-auto: create-drop — Hibernate genera lo schema dalle entity; Flyway disabilitato.
# MODE=MySQL per compatibilità con le query. Usato da CoreServiceApplicationTest.
# TenantFilterJpaConfig è @Profile("!test") quindi non carica il wrapper EM.
# Audit consumer disabilitato di default (riattivato nei test di integrazione Kafka).
spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: localhost:19092
    listener:
      auto-startup: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost/auth/realms/test

secureflow:
  webhook:
    worker-enabled: false
  audit:
    consumer-enabled: false
