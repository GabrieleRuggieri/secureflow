name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build & unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [core-service, gateway-service]
    defaults:
      run:
        working-directory: backend/${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Unit tests
        run: mvn -B test -Dsurefire.excludedGroups=integration

  docker-images:
    name: Build local Docker images
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Build core-service image
        run: docker build -f backend/core-service/Dockerfile -t secureflow-core:ci .
      - name: Build gateway-service image
        run: docker build -f backend/gateway-service/Dockerfile -t secureflow-gateway:ci .
      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t secureflow-frontend:ci .

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  compose-infra:
    name: Compose infra smoke
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Start infrastructure
        run: |
          cp .env.example .env
          docker compose up -d mysql redis kafka
      - name: Wait for MySQL
        run: |
          for i in $(seq 1 60); do
            if docker compose exec -T mysql mysqladmin ping -h localhost -usecureflow -psecureflow --silent; then
              docker compose exec -T mysql mysql -usecureflow -psecureflow -e "SELECT 1" >/dev/null 2>&1 && exit 0
            fi
            sleep 2
          done
          echo "MySQL not ready"
          docker compose logs mysql
          exit 1
      - name: Flyway migrate
        run: docker compose --profile init run --rm flyway
      - name: Tear down
        if: always()
        run: docker compose down -v
